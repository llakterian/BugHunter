name: 🎯 Bug Bounty Hunter Pro CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.8'
  PYTHON_VERSIONS: '["3.8", "3.9", "3.10", "3.11", "3.12"]'

jobs:
  # Security and Code Quality Checks
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
        
    - name: 🔍 Run Bandit Security Scan
      run: |
        bandit -r . -x tests/ -f json -o bandit-report.json || true
        bandit -r . -x tests/ -f txt
        
    - name: 🛡️ Check Dependencies for Vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
        
    - name: 📊 Upload Security Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # Code Quality and Linting
  code-quality:
    name: 📋 Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pylint
        pip install -r requirements.txt
        
    - name: 🎨 Check Code Formatting (Black)
      run: |
        black --check --diff .
        
    - name: 📏 Check Import Sorting (isort)
      run: |
        isort --check-only --diff .
        
    - name: 🔍 Lint Code (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        
    - name: 🔬 Type Checking (mypy)
      run: |
        mypy . --ignore-missing-imports || true
        
    - name: 📊 Code Analysis (pylint)
      run: |
        pylint **/*.py --exit-zero --output-format=json > pylint-report.json || true
        pylint **/*.py --exit-zero
        
    - name: 📈 Upload Code Quality Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-reports
        path: |
          pylint-report.json

  # Multi-Platform Testing
  test:
    name: 🧪 Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ${{ fromJson(env.PYTHON_VERSIONS) }}
        
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
        
    - name: 🧪 Run Tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html -n auto
        
    - name: 📊 Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PYTHON_VERSION
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        
    - name: 📈 Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml

  # Integration Testing
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: 🏗️ Setup Test Environment
      run: |
        chmod +x install.sh
        ./install.sh --test-mode
        
    - name: 🧪 Run Integration Tests
      run: |
        python3 quick_test.py
        python3 test_installation.py
        
    - name: 🎯 Test Core Functionality
      run: |
        timeout 30s python3 launch_hunter.py --test-mode || true
        
    - name: 📊 Generate Test Report
      run: |
        pytest tests/integration/ -v --html=integration-report.html --self-contained-html
        
    - name: 📈 Upload Integration Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          integration-report.html

  # Performance Testing
  performance-test:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark memory-profiler
        
    - name: ⚡ Run Performance Tests
      run: |
        pytest tests/performance/ -v --benchmark-json=benchmark-results.json
        
    - name: 📊 Memory Profiling
      run: |
        python -m memory_profiler test_memory_usage.py > memory-profile.txt || true
        
    - name: 📈 Upload Performance Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: |
          benchmark-results.json
          memory-profile.txt

  # Documentation Build
  docs:
    name: 📚 Documentation
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser
        pip install -r requirements.txt
        
    - name: 📖 Build Documentation
      run: |
        cd docs/
        make html
        
    - name: 📤 Deploy Documentation
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html

  # Docker Build and Test
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔑 Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: 🏗️ Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          bughunterpro/bug-bounty-hunter:latest
          bughunterpro/bug-bounty-hunter:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Release Build
  release:
    name: 🚀 Release Build
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, integration-test, performance-test]
    if: github.event_name == 'release'
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel
        pip install -r requirements.txt
        
    - name: 🏗️ Build Distribution
      run: |
        python -m build
        
    - name: 🔍 Check Distribution
      run: |
        twine check dist/*
        
    - name: 📤 Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
        
    - name: 📋 Create Release Assets
      run: |
        zip -r bug-bounty-hunter-${{ github.event.release.tag_name }}.zip . -x "*.git*" "*__pycache__*" "*.pyc"
        
    - name: 📤 Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./bug-bounty-hunter-${{ github.event.release.tag_name }}.zip
        asset_name: bug-bounty-hunter-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip

  # Notification
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, integration-test, performance-test]
    if: always()
    steps:
    - name: 📊 Collect Results
      id: results
      run: |
        echo "security_result=${{ needs.security-scan.result }}" >> $GITHUB_OUTPUT
        echo "quality_result=${{ needs.code-quality.result }}" >> $GITHUB_OUTPUT
        echo "test_result=${{ needs.test.result }}" >> $GITHUB_OUTPUT
        echo "integration_result=${{ needs.integration-test.result }}" >> $GITHUB_OUTPUT
        echo "performance_result=${{ needs.performance-test.result }}" >> $GITHUB_OUTPUT
        
    - name: 📢 Discord Notification
      if: github.ref == 'refs/heads/main'
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          🎯 **Bug Bounty Hunter Pro CI/CD Results**
          
          **Branch:** `${{ github.ref_name }}`
          **Commit:** `${{ github.sha }}`
          **Author:** ${{ github.actor }}
          
          **Results:**
          🔒 Security: ${{ steps.results.outputs.security_result }}
          📋 Quality: ${{ steps.results.outputs.quality_result }}
          🧪 Tests: ${{ steps.results.outputs.test_result }}
          🔗 Integration: ${{ steps.results.outputs.integration_result }}
          ⚡ Performance: ${{ steps.results.outputs.performance_result }}
          
          **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Cleanup
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, integration-test, performance-test, docs, docker]
    if: always()
    steps:
    - name: 🧹 Clean up artifacts
      run: |
        echo "Cleaning up temporary files and artifacts..."
        # Cleanup logic here if needed